<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Task List sederhana untuk latihan automation testing dengan Cypress">
  <title>Task List</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <p class="eyebrow">Daily focus</p>
      <h1>Task List</h1>
      <p class="intro">Atur pekerjaan kecilmu, satu task pada satu waktu.</p>
    </header>

    <section class="task-panel" aria-labelledby="task-form-title">
      <div class="section-heading">
        <div>
          <p class="section-label">Daftar pekerjaan</p>
          <h2 id="task-form-title">Apa yang perlu diselesaikan?</h2>
        </div>
        <span class="status-dot" aria-hidden="true"></span>
      </div>

      <form id="task-form" class="task-form">
        <label class="sr-only" for="task-input">Nama task</label>
        <input
          id="task-input"
          data-cy="task-input"
          name="task"
          type="text"
          placeholder="Contoh: Review laporan harian"
          autocomplete="off"
          maxlength="120"
        >
        <button data-cy="add-task" type="submit">Tambah</button>
      </form>
      <p data-cy="validation-message" class="validation-message" role="alert" hidden></p>

      <div class="stats" aria-label="Ringkasan task">
        <div class="stat-item">
          <span class="stat-value" data-cy="active-count">0</span>
          <span class="stat-label">Aktif</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" data-cy="completed-count">0</span>
          <span class="stat-label">Selesai</span>
        </div>
      </div>

      <div data-cy="task-list" class="task-list" aria-live="polite"></div>
      <p data-cy="empty-state" class="empty-state">Belum ada task. Tambahkan task pertamamu di atas.</p>
    </section>

    <footer class="app-footer">
      <span class="footer-mark" aria-hidden="true">✓</span>
      <span>Fokus pada progres, bukan kesempurnaan.</span>
    </footer>
  </main>
</body>
</html>
